- title: Research Experience
  type: time_table
  contents:
    - title: PhD Candidate
      institution: University of Delaware, Department of Earth Sciences
      year: 2023 - Present
      description:
        - "Project: Antarctic Ice Sheet Dynamics across the Mid-Pleistocene Transition through high-resolution IRD records"
        - Deep learning-based instance segmentation of IRD from sediment core X-ray scans
        - Time-series analysis of IRD flux spanning approximately 1.4 million years
        - Development of ice sheet and iceberg trajectory models
        - Antarctic IRD provenance studies using Sr, Nd, and Pb isotopes

    - title: Summer Visitor
      institution: NSF National Center for Atmospheric Research (NCAR), Boulder, CO
      year: Jun 2026 - Jul 2026
      description:
        - "Project: Linking Southern Ocean Ice-Rafted Debris Flux with Antarctic Ice Sheet Dynamics"
        - Simulated Antarctic ice sheet calving rates for modern and past climates using the Community Ice Sheet Model (CISM)
        - Generated iceberg size distributions from simulated CISM calving rates
        - Developed iceberg trajectory modeling including breakup of giant icebergs and meltwater distribution
        - Validated model outputs using radiogenic isotopic analyses of IRD grains

    - title: Junior Research Fellow
      institution: Indian Institute of Science, Bangalore, India
      year: 2021 - 2023
      description:
        - "Project: Reconstruction of atmospheric CO₂ using Boron isotope ratios in marine carbonates"
        - Species-level identification of foraminifera
        - Chemical cleaning and sample processing in a Class-100 clean laboratory
        - ICP-OES and triple quadrupole ICP-MS analysis

    - title: M.Sc. Research Student
      institution: Banaras Hindu University, Varanasi, India
      year: 2019 - 2021
      description:
        - Sea surface temperature estimation using planktic foraminiferal assemblages and machine learning
        - Applied ANN, SVM, AdaBoost, Random Forest, and other machine learning techniques
        - Coding in Python, C++, BASH, and SLURM
        - Experience with PyFERRET, PyGMT, SeaDAS, and Ocean Data View (ODV)

